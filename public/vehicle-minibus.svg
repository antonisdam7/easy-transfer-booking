<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 558" width="1024" height="558" role="img" aria-label="Illustration of a 16-seat minibus">
  <!--
    Drawn here rather than photographed, because there is no photograph of this vehicle
    yet and the only other one to hand belonged to a competitor. It is deliberately a
    drawing and not an attempt at one: nobody looking at it will think they have been
    shown the exact bus that turns up, which is the honest position until the operator
    sends a picture of his own. Replace the file and the card changes; nothing else does.
  -->
  <rect width="1024" height="558" fill="#eef2f4"/>

  <g transform="translate(72 96)">
    <!-- body -->
    <path d="M40 250 L40 96 Q40 60 78 56 L520 30 Q604 26 664 62 L806 148 Q844 172 844 210 L844 250 Q844 268 826 268 L58 268 Q40 268 40 250 Z"
          fill="#cfd9e0" stroke="#8fa3b0" stroke-width="6" stroke-linejoin="round"/>
    <!-- roof line -->
    <path d="M52 92 Q52 70 82 68 L520 42" fill="none" stroke="#e7edf1" stroke-width="8" stroke-linecap="round"/>

    <!-- windscreen -->
    <path d="M672 82 L788 152 Q812 168 814 190 L700 190 Q684 190 682 174 L672 96 Z"
          fill="#9db6c6" stroke="#8fa3b0" stroke-width="5" stroke-linejoin="round"/>

    <!-- passenger windows -->
    <g fill="#9db6c6" stroke="#8fa3b0" stroke-width="5">
      <rect x="86" y="94" width="126" height="86" rx="8"/>
      <rect x="228" y="88" width="126" height="90" rx="8"/>
      <rect x="370" y="82" width="126" height="94" rx="8"/>
      <rect x="512" y="76" width="126" height="98" rx="8"/>
    </g>

    <!-- door seam -->
    <path d="M362 84 L362 264" stroke="#8fa3b0" stroke-width="5" stroke-linecap="round"/>

    <!-- sill -->
    <path d="M44 236 L840 236" stroke="#8fa3b0" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

    <!-- lamps -->
    <rect x="806" y="196" width="36" height="22" rx="8" fill="#f2f6f8" stroke="#8fa3b0" stroke-width="4"/>
    <rect x="42" y="196" width="26" height="22" rx="8" fill="#d98a8a" stroke="#8fa3b0" stroke-width="4"/>

    <!-- wheels -->
    <g>
      <circle cx="204" cy="268" r="58" fill="#3f4c55"/>
      <circle cx="204" cy="268" r="26" fill="#cfd9e0" stroke="#8fa3b0" stroke-width="5"/>
      <circle cx="700" cy="268" r="58" fill="#3f4c55"/>
      <circle cx="700" cy="268" r="26" fill="#cfd9e0" stroke="#8fa3b0" stroke-width="5"/>
    </g>

    <!-- ground -->
    <path d="M0 330 L880 330" stroke="#d5dee4" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
